<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Examen de cultura general para el ingreso a la Rama Diplomático-Consular del Servicio Exterior Mexicano.">
  <title>Examen de Ingreso - Rama Diplomático-Consular</title>
  <link rel="stylesheet" href="../quiz.css">
  <script src="quiz.js" defer></script>
</head>
<body>
  <h1>Examen de Cultura General — Ingreso a la Rama Diplomático-Consular del Servicio Exterior Mexicano</h1>
  <div class="sub">120 preguntas · Selecciona una respuesta por pregunta</div>

  <nav class="exam-switcher" aria-label="Seleccionar examen">
    <a class="exam-switcher__option is-active" href="/SEM/dc/" aria-label="Examen Diplomático-Consular" aria-current="page" title="Diplomático-Consular">Diplomático</a>
    <a class="exam-switcher__option" href="/SEM/ta/" aria-label="Examen Técnico-Administrativo" title="Técnico-Administrativa">Técnico</a>
  </nav>

  <div id="progressBar">
    <div id="progressTrack"><div id="progressFill"></div></div>
    <div id="progressText">0 / 120 respondidas</div>
  </div>

  <div class="container" id="quizContainer"></div>

  <button id="finishBtn">Ver resultado final</button>

  <div id="resultBox">
    <h2>Resultado</h2>
    <div id="scoreBig"></div>
    <p id="scoreDetail"></p>
    <button id="retryBtn">Reintentar examen</button>
  </div>
</body>
</html>
