</head>

let answered = new Array(questions.length).fill(false);

const container = document.getElementById('quizContainer');
questions.forEach((item, qi) => {
  const div = document.createElement('div');
  div.className = 'question';
  div.innerHTML = `<div class="qtext"><span class="qnum">${qi+1}.</span>${item.q}</div>
    <div class="options" id="opts-${qi}"></div>`;
  container.appendChild(div);

  const opts = div.querySelector(`#opts-${qi}`);
  item.o.forEach((optText, oi) => {
    const btn = document.createElement('button');
    btn.className = 'option';
    btn.textContent = String.fromCharCode(97+oi) + ') ' + optText;
    btn.onclick = () => selectAnswer(qi, oi, btn);
    opts.appendChild(btn);
  });
});

function selectAnswer(qi, oi, btn){
  if(answered[qi]) return;
  answered[qi] = true;
  const opts = document.getElementById(`opts-${qi}`).children;
  const correctIdx = questions[qi].a;
  for(let i=0;i<opts.length;i++){
    opts[i].disabled = true;
    if(i === correctIdx) opts[i].classList.add(i===oi ? 'correct' : 'reveal');
  }
  if(oi !== correctIdx) btn.classList.add('incorrect');
  updateProgress();
}

function updateProgress(){
  const count = answered.filter(Boolean).length;
  document.getElementById('progressFill').style.width = (count/questions.length*100) + '%';
  document.getElementById('progressText').textContent = `${count} / ${questions.length} respondidas`;
}

document.getElementById('finishBtn').onclick = () => {
  let correct = 0;
  questions.forEach((item, qi) => {
    const opts = document.getElementById(`opts-${qi}`).children;
    if(opts[item.a].classList.contains('correct')) correct++;
  });
  const total = questions.length;
  const answeredCount = answered.filter(Boolean).length;
  const pct = ((correct/total)*100).toFixed(1);
  document.getElementById('scoreBig').textContent = pct + '%';
  document.getElementById('scoreDetail').textContent =
    `${correct} de ${total} correctas · ${answeredCount} de ${total} respondidas`;
  document.getElementById('resultBox').style.display = 'block';
  document.getElementById('resultBox').scrollIntoView({behavior:'smooth'});
};

document.getElementById('retryBtn').onclick = () => location.reload();
</script>
